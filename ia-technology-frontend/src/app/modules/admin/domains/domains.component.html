<div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
  <div>
    <h1>Gestion des Domaines</h1>
    <p>Organisez l'architecture de recherche par taxonomies pr&eacute;cises et domaines scientifiques strat&eacute;giques.</p>
  </div>
  <button class="btn btn-primary" (click)="openNew()"><i class="pi pi-plus"></i> Nouveau domaine</button>
</div>

<div style="margin-bottom:1.5rem">
  <div style="position:relative;max-width:360px">
    <i class="pi pi-search" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
    <input class="form-input" [(ngModel)]="searchQuery" placeholder="Rechercher un domaine..."
           style="padding-left:2.25rem" />
  </div>
</div>

<div class="domain-grid">
  <div *ngFor="let d of filtered" class="domain-card">
    <div class="dc-category">{{ d.category || 'Non classé' }}</div>
    <h3>{{ d.name }}</h3>
    <p>{{ d.description }}</p>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="dc-link">Voir publications</span>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-sm btn-ghost" (click)="edit(d)"><i class="pi pi-pencil"></i></button>
        <button class="btn btn-sm btn-ghost" style="color:var(--danger)" (click)="delete(d.id)"><i class="pi pi-trash"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- Dialog -->
<div *ngIf="showDialog" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center"
     (click)="showDialog = false">
  <div style="background:var(--surface);border-radius:var(--radius-lg);padding:2rem;width:480px;box-shadow:var(--shadow-lg)"
       (click)="$event.stopPropagation()">
    <h2 style="margin-bottom:1.5rem">{{ editingId ? 'Modifier' : 'Nouveau' }} domaine</h2>
    <div class="form-group">
      <label class="form-label">Nom</label>
      <input class="form-input" [(ngModel)]="form.name" />
    </div>
    <div class="form-group">
      <label class="form-label">Cat&eacute;gorie</label>
      <input class="form-input" [(ngModel)]="form.category" placeholder="ex: TAXONOMIE ALPHA" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" [(ngModel)]="form.description" rows="4" style="resize:vertical"></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1rem">
      <button class="btn btn-outline" (click)="showDialog = false">Annuler</button>
      <button class="btn btn-primary" (click)="save()">{{ editingId ? 'Modifier' : 'Cr&eacute;er' }}</button>
    </div>
  </div>
</div>
