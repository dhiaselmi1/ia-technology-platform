<div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
  <div>
    <h1>Gestion des Actualit&eacute;s</h1>
    <p>Cr&eacute;ez et g&eacute;rez les annonces de l'IA Research Hub.</p>
  </div>
  <button class="btn btn-primary" (click)="openNew()"><i class="pi pi-plus"></i> Nouvelle actualit&eacute;</button>
</div>

<div class="data-card">
  <table class="data-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>Titre</th>
        <th>Auteur</th>
        <th>&Agrave; la une</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let n of news">
        <td style="width:64px">
          <div class="table-thumb">
            <img *ngIf="n.imageUrl" [src]="'http://localhost:8080/uploads/' + n.imageUrl" [alt]="n.title" />
            <i *ngIf="!n.imageUrl" class="pi pi-image"></i>
          </div>
        </td>
        <td><strong>{{ n.title }}</strong></td>
        <td style="font-size:.8125rem;color:var(--text-secondary)">{{ n.authorUsername }}</td>
        <td>
          <button class="btn btn-sm" [class.btn-primary]="n.featured" [class.btn-outline]="!n.featured"
                  (click)="toggleFeatured(n)">
            {{ n.featured ? 'Oui' : 'Non' }}
          </button>
        </td>
        <td style="font-size:.8125rem;color:var(--text-muted)">{{ n.createdAt | date:'dd MMM yyyy' }}</td>
        <td>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-sm btn-outline" (click)="edit(n)"><i class="pi pi-pencil"></i></button>
            <button class="btn btn-sm btn-outline" style="color:var(--danger)" (click)="delete(n.id)"><i class="pi pi-trash"></i></button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Dialog -->
<div *ngIf="showDialog" class="dialog-backdrop" (click)="showDialog = false">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <h2 style="margin-bottom:1.5rem">{{ editingId ? 'Modifier' : 'Nouvelle' }} actualit&eacute;</h2>
    <div class="form-group">
      <label class="form-label">Titre</label>
      <input class="form-input" [(ngModel)]="form.title" />
    </div>
    <div class="form-group">
      <label class="form-label">Contenu</label>
      <textarea class="form-input" [(ngModel)]="form.content" rows="6" style="resize:vertical"></textarea>
    </div>

    <!-- Image upload -->
    <div class="form-group">
      <label class="form-label">Image</label>
      <div class="upload-zone" *ngIf="!uploadPreview">
        <input type="file" accept="image/*" (change)="onImageSelected($event)" id="newsImage" style="display:none" />
        <label for="newsImage" class="upload-label">
          <i class="pi pi-cloud-upload"></i>
          <span>Cliquer pour choisir une image</span>
          <small>JPG, PNG, GIF — max 5 Mo</small>
        </label>
      </div>
      <div class="upload-preview" *ngIf="uploadPreview">
        <img [src]="uploadPreview" alt="Preview" />
        <div class="upload-preview-actions">
          <span *ngIf="uploading" class="upload-status"><i class="pi pi-spin pi-spinner"></i> Upload en cours...</span>
          <span *ngIf="!uploading && form.imageUrl" class="upload-status success"><i class="pi pi-check"></i> Image upload&eacute;e</span>
          <button class="btn btn-sm btn-outline" style="color:var(--danger)" (click)="removeImage()"><i class="pi pi-trash"></i> Supprimer</button>
        </div>
      </div>
    </div>

    <label class="remember-row">
      <input type="checkbox" [(ngModel)]="form.featured" />
      &Agrave; la une
    </label>
    <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1rem">
      <button class="btn btn-outline" (click)="showDialog = false">Annuler</button>
      <button class="btn btn-primary" [disabled]="uploading" (click)="save()">{{ editingId ? 'Modifier' : 'Publier' }}</button>
    </div>
  </div>
</div>
