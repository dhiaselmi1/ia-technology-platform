<div class="auth-page">
  <a routerLink="/" class="back-home-btn"><i class="pi pi-arrow-left"></i> Retour &agrave; l'accueil</a>

  <div class="auth-brand">
    <span class="brand-icon"><i class="pi pi-bolt"></i></span>
    IA-Technology
  </div>
  <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:.25rem">Acc&egrave;s Chercheur</h1>
  <p class="auth-subtitle">IA Research Hub Portal</p>

  <div class="auth-card">
    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Adresse e-mail</label>
        <div class="form-input-icon">
          <i class="pi pi-envelope"></i>
          <input class="form-input" type="email" [(ngModel)]="email" name="email"
                 placeholder="nom&#64;institution.fr" required />
        </div>
      </div>

      <div class="form-group">
        <div class="password-row">
          <label class="form-label">Mot de passe</label>
          <a href="javascript:void(0)">Oubli&eacute; ?</a>
        </div>
        <div class="form-input-icon" style="position:relative">
          <i class="pi pi-lock"></i>
          <input class="form-input" [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="password" name="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required
                 style="padding-right:2.5rem" />
          <i class="pi" [class.pi-eye]="!showPassword" [class.pi-eye-slash]="showPassword"
             (click)="showPassword = !showPassword"
             style="position:absolute;right:.875rem;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-muted);left:auto"></i>
        </div>
      </div>

      <label class="remember-row">
        <input type="checkbox" [(ngModel)]="rememberMe" name="remember" />
        Rester connect&eacute;
      </label>

      <button type="submit" class="auth-submit" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
        <i *ngIf="!loading" class="pi pi-arrow-right"></i>
      </button>
    </form>

    <div class="auth-divider"></div>

    <p class="auth-footer-link">
      Nouveau sur la plateforme ? <a routerLink="/auth/register">Cr&eacute;er un compte</a>
    </p>
  </div>

  <div class="auth-page-footer">
    <div class="footer-links">
      <a href="#">Support</a>
      <a href="#">Confidentialit&eacute;</a>
      <a href="#">Directives</a>
    </div>
    <div class="footer-brand">Precision Curator Intelligence</div>
  </div>
</div>
